title: "Xplore Research Institute"
description: "An independent research institute supporting interdisciplinary science, experimental investigation, theoretical research, and open scientific knowledge."

url: "https://xplore-research.org"
baseurl: ""

lang: "en"
timezone: "America/New_York"

logo: "/assets/images/xplore-logo.jpg"

author:
  name: "Xplore Research Institute"

social:
  name: "Xplore Research Institute"
  links: []

markdown: kramdown
permalink: /articles/:title/

collections:
  publications:
    output: true
    permalink: /publications/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      author: "Xplore Research Institute"

  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
