title: Xplore Research Institute
description: Independent research, scientific publications, and open knowledge.
url: ""
baseurl: ""
lang: en
timezone: UTC
markdown: kramdown
permalink: /articles/:title/
collections:
  publications:
    output: true
    permalink: /publications/:name/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
  - scope:
      path: ""
    values:
      layout: default
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
plugins:
  - jekyll-feed
  - jekyll-seo-tag
